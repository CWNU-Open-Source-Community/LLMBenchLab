[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "llmbenchlab-backend"
version = "0.1.0"
description = "FastAPI backend for the LLMBenchLab MVP"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0.32,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
llmbenchlab-worker = "app.worker:main"
llmbenchlab-worker-probe = "app.worker_probe:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires explicitly configured local infrastructure",
  "smoke: fully offline end-to-end vertical-slice checks",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
