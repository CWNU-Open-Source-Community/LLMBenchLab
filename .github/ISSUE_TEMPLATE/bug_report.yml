name: Bug report
description: Report a reproducible defect in LLMBenchLab.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LLMBenchLab. Remove credentials, model outputs containing private data, and other secrets before submitting.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the defect and its impact.
      placeholder: A clear, concise description of the observed behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Start the project with ...
        2. Create a Mock run with ...
        3. Open ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, Node.js, browser, commit, and local or Docker mode.
      placeholder: |
        OS: macOS 15
        Python: 3.12.x
        Node.js: 22.x
        Browser: Firefox ...
        Commit: ...
        Run mode: local / Docker Compose
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Redact API keys, Authorization headers, URLs with credentials, and private model content.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I reproduced this with the latest available revision.
          required: true
        - label: I removed all secrets and private data from this report.
          required: true

