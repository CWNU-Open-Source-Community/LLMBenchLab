name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRONTEND_ORIGIN: http://localhost:5173
      LOG_LEVEL: WARNING
      DEMO_API_KEY_ENV: LLMBENCHLAB_CI_UNUSED_API_KEY
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure isolated temporary SQLite
        run: echo "DATABASE_URL=sqlite:///${RUNNER_TEMP}/llmbenchlab-ci.db" >> "$GITHUB_ENV"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32

      - name: Install locked backend dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Backend tests (offline Mock and temporary SQLite)
        run: uv run pytest

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build
